name: Build Balkan Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -e
          mkdir -p android-project

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            FOUND=0

            for ZIP in *.zip; do
              [ -f "$ZIP" ] || continue

              mkdir -p android-project
              unzip -oq "$ZIP" -d android-project

              PROJECT_FILE=$(find android-project \
                -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print -quit)

              if [ -n "$PROJECT_FILE" ]; then
                PROJECT_DIR=$(dirname "$PROJECT_FILE")
                echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
                FOUND=1
                break
              fi
            done

            if [ "$FOUND" -eq 0 ]; then
              echo "ERROR: Android Gradle project not found."
              echo "Check that the repository contains the Android project or its ZIP file."
              exit 1
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Balkan-Radio-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
