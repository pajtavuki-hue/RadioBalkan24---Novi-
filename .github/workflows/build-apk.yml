name: Build Balkan Radio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            while IFS= read -r -d '' ZIP; do
              DEST="$RUNNER_TEMP/android-project-$(basename "$ZIP" .zip)"
              mkdir -p "$DEST"
              unzip -oq "$ZIP" -d "$DEST"

              SETTINGS=$(find "$DEST" -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -print -quit)

              if [ -n "$SETTINGS" ]; then
                ROOT="$(dirname "$SETTINGS")"

                if [ -f "$ROOT/app/build.gradle" ] || \
                   [ -f "$ROOT/app/build.gradle.kts" ]; then
                  PROJECT_DIR="$ROOT"
                  break
                fi
              fi
            done < <(find . -maxdepth 3 -type f -iname '*.zip' -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find a complete Android project with an app module."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Balkan-Radio-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
